<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creando Tendencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#FCFBFD;
    --tinta:#2E2833;
    --lila:#6E5A93;
    --lila-velo:#EDE6F5;
    --rosa:#E3AEBF;
    --rosa-velo:#F8EDF1;
    --linea:#DDD6E4;
    --medida:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Jost',system-ui,sans-serif;
    font-weight:300;
    background:var(--papel);
    color:var(--tinta);
    min-height:100vh;
    display:flex;flex-direction:column;
    line-height:1.55;
  }
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

  /* ---- estructura ---- */
  .marco{width:100%;max-width:var(--medida);margin:0 auto;padding:0 32px;flex:1;display:flex;flex-direction:column}
  header{padding:40px 0 0;display:flex;align-items:baseline;gap:18px}
  .marca{font-size:15px;letter-spacing:.24em;font-weight:400}
  .marca span{color:var(--lila)}
  .sello{font-size:12px;color:#8C8496;letter-spacing:.08em}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:72px 0}
  h1{font-size:clamp(34px,6vw,58px);font-weight:200;letter-spacing:-.015em;line-height:1.05}
  .bajada{margin-top:14px;max-width:44ch;color:#6F6878;font-size:16px}

  /* ---- divisiones ---- */
  .divisiones{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--linea);border-left:1px solid var(--linea)}
  .division{
    border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);
    padding:36px 32px 32px;text-align:left;display:flex;flex-direction:column;gap:26px;
    background:transparent;transition:background .35s ease;position:relative;min-height:290px;
  }
  .division:hover,.division:focus-visible{background:var(--lila-velo);outline:none}
  .division.rosa:hover,.division.rosa:focus-visible{background:var(--rosa-velo)}
  .division:focus-visible{box-shadow:inset 0 0 0 1px var(--lila)}
  .plano{width:100%;height:118px;color:var(--lila);opacity:.85}
  .division.rosa .plano{color:var(--rosa)}
  .division h2{font-size:26px;font-weight:300;letter-spacing:-.01em}
  .division p{font-size:14.5px;color:#6F6878;margin-top:6px}
  .entrar{margin-top:auto;font-size:13px;letter-spacing:.14em;color:var(--lila);border-bottom:1px solid currentColor;align-self:flex-start;padding-bottom:3px}

  /* ---- acceso ---- */
  .acceso{max-width:380px}
  .volver{font-size:13px;color:#8C8496;margin-bottom:28px;display:inline-block;border-bottom:1px solid var(--linea);padding-bottom:2px}
  .campo{margin-top:22px}
  label{display:block;font-size:13px;color:#6F6878;margin-bottom:7px}
  input{
    width:100%;padding:11px 2px;font:inherit;font-size:16px;
    border:none;border-bottom:1px solid var(--linea);background:transparent;color:var(--tinta);
  }
  input:focus{outline:none;border-bottom-color:var(--lila)}
  .primario{
    margin-top:34px;width:100%;padding:13px;background:var(--lila);color:#fff;
    font-size:14px;letter-spacing:.1em;transition:background .25s ease;
  }
  .primario:hover{background:#584778}
  .primario:disabled{opacity:.5;cursor:default}
  .aviso{margin-top:18px;font-size:14px;color:#A24B67;min-height:20px}

  /* ---- panel ---- */
  .modulos{margin-top:44px;display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .modulo{background:var(--papel);padding:28px;min-height:150px;display:flex;flex-direction:column;gap:8px}
  .modulo h3{font-size:19px;font-weight:400}
  .modulo p{font-size:14px;color:#6F6878}
  .modulo .pronto{margin-top:auto;font-size:12px;color:#9B93A5;letter-spacing:.08em}
  .quien{display:flex;gap:14px;align-items:baseline;font-size:14px;color:#6F6878;margin-top:10px}
  .rol{color:var(--lila)}
  .salir{font-size:13px;color:#8C8496;border-bottom:1px solid var(--linea)}

  footer{padding:26px 0 34px;border-top:1px solid var(--linea);font-size:12.5px;color:#9B93A5;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  .oculto{display:none}
  @media (max-width:720px){
    .marco{padding:0 20px}
    .divisiones{grid-template-columns:1fr}
    main{padding:48px 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="marco">

  <header>
    <div class="marca">CREANDO <span>TENDENCIAS</span></div>
    <div class="sello">Sistema operativo interno</div>
  </header>

  <main>

    <!-- ============ 1. DIVISIONES ============ -->
    <section id="pantalla-divisiones">
      <h1>Escoge tu división</h1>
      <p class="bajada">Cada división abre sus propios módulos. Tu acceso depende del rol que tengas asignado.</p>

      <div class="divisiones">
        <button class="division" data-division="tendencias">
          <svg class="plano" viewBox="0 0 220 118" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <rect x="12" y="20" width="84" height="78"/>
            <path d="M12 46h84M12 72h84M54 20v78"/>
            <rect x="124" y="20" width="84" height="34"/>
            <rect x="124" y="64" width="84" height="34"/>
            <circle cx="166" cy="37" r="7"/>
          </svg>
          <div>
            <h2>Creando Tendencias</h2>
            <p>Clientes, stock y almacén.</p>
          </div>
          <span class="entrar">Entrar</span>
        </button>

        <button class="division rosa" data-division="hogares">
          <svg class="plano" viewBox="0 0 220 118" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M14 98V34l50-24 50 24v64"/>
            <path d="M64 98V62h50M114 62h92v36H14"/>
            <path d="M150 62v36M178 62v36"/>
            <path d="M34 62h20v20H34z"/>
          </svg>
          <div>
            <h2>Creando Hogares</h2>
            <p>Alquileres, contratos y pagos.</p>
          </div>
          <span class="entrar">Entrar</span>
        </button>
      </div>
    </section>

    <!-- ============ 2. ACCESO ============ -->
    <section id="pantalla-acceso" class="acceso oculto">
      <button class="volver" data-volver>Volver a divisiones</button>
      <h1 id="titulo-acceso">Acceso</h1>
      <p class="bajada" id="sub-acceso"></p>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="primario" id="btn-entrar">Entrar</button>
      <p class="aviso" id="aviso"></p>
    </section>

    <!-- ============ 3. PANEL ============ -->
    <section id="pantalla-panel" class="oculto">
      <h1 id="titulo-panel">Panel</h1>
      <div class="quien">
        <span id="quien-nombre"></span>
        <span class="rol" id="quien-rol"></span>
        <button class="salir" id="btn-salir">Cerrar sesión</button>
      </div>
      <div class="modulos" id="lista-modulos"></div>
    </section>

  </main>

  <footer>
    <span>Creando Tendencias · Lima, Perú</span>
    <span id="estado-conexion">Modo demostración</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---------------------------------------------------------------
// CONFIGURACIÓN — pegar los datos de Supabase > Project Settings > API
// ---------------------------------------------------------------
const SUPABASE_URL  = "TU_SUPABASE_URL";
const SUPABASE_ANON = "TU_SUPABASE_ANON_KEY";

const conectado = !SUPABASE_URL.startsWith("TU_");
const sb = conectado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
if (conectado) document.getElementById("estado-conexion").textContent = "Conectado a Supabase";

const DIVISIONES = {
  tendencias: { nombre: "Creando Tendencias", modulos: ["clientes", "almacen"] },
  hogares:    { nombre: "Creando Hogares",    modulos: ["alquileres"] }
};
const MODULOS = {
  clientes:   { nombre: "Clientes",        texto: "Directorio, datos de contacto e historial." },
  almacen:    { nombre: "Stock y almacén", texto: "Productos, entradas, salidas y stock actual." },
  alquileres: { nombre: "Alquileres",      texto: "Propiedades, habitaciones, contratos y pagos." }
};
const ROLES = {
  super_admin: "Super administradora",
  admin: "Administradora", staff: "Staff", usuario: "Usuario", cliente: "Cliente"
};

let division = null;
const $ = id => document.getElementById(id);
const mostrar = id => ["pantalla-divisiones","pantalla-acceso","pantalla-panel"]
  .forEach(p => $(p).classList.toggle("oculto", p !== id));

document.querySelectorAll(".division").forEach(b => b.addEventListener("click", () => {
  division = b.dataset.division;
  $("titulo-acceso").textContent = DIVISIONES[division].nombre;
  $("sub-acceso").textContent = "Ingresa con tu correo y contraseña.";
  $("aviso").textContent = "";
  mostrar("pantalla-acceso");
  $("email").focus();
}));

document.querySelectorAll("[data-volver]").forEach(b =>
  b.addEventListener("click", () => mostrar("pantalla-divisiones")));

$("btn-entrar").addEventListener("click", entrar);
$("clave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });

async function entrar(){
  const email = $("email").value.trim();
  const clave = $("clave").value;
  const aviso = $("aviso");
  aviso.textContent = "";

  if (!email || !clave) { aviso.textContent = "Falta el correo o la contraseña."; return; }

  if (!conectado) {
    abrirPanel({ nombre: email.split("@")[0], rol: "super_admin" });
    return;
  }

  $("btn-entrar").disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: clave });
  $("btn-entrar").disabled = false;

  if (error) { aviso.textContent = "Correo o contraseña incorrectos."; return; }

  const { data: perfil } = await sb.from("perfiles")
    .select("nombre, rol, activo").eq("id", data.user.id).single();

  if (!perfil || !perfil.activo) {
    aviso.textContent = "Esta cuenta está desactivada. Habla con una super administradora.";
    await sb.auth.signOut();
    return;
  }
  abrirPanel(perfil);
}

function abrirPanel(perfil){
  $("titulo-panel").textContent = DIVISIONES[division].nombre;
  $("quien-nombre").textContent = perfil.nombre || "";
  $("quien-rol").textContent = ROLES[perfil.rol] || perfil.rol;

  const lista = DIVISIONES[division].modulos.slice();
  if (perfil.rol === "super_admin") lista.push("usuarios");
  MODULOS.usuarios = { nombre: "Usuarios y permisos", texto: "Altas, roles y límites de acceso." };

  $("lista-modulos").innerHTML = lista.map(id => `
    <div class="modulo">
      <h3>${MODULOS[id].nombre}</h3>
      <p>${MODULOS[id].texto}</p>
      <span class="pronto">En construcción</span>
    </div>`).join("");

  mostrar("pantalla-panel");
}

$("btn-salir").addEventListener("click", async () => {
  if (conectado) await sb.auth.signOut();
  $("email").value = ""; $("clave").value = "";
  mostrar("pantalla-divisiones");
});
</script>
</body>
</html>
