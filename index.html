<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creando Tendencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#FDFCFD; --tinta:#2B2430;
    --morado:#8E2C7B; --morado-hondo:#6A1F5C; --magenta:#B4479B;
    --lila:#C08BD0; --lila-velo:#F5EDF7; --agua:#4FBBD4; --agua-velo:#EAF7FA;
    --linea:#E6DEEA; --gris:#6E6678; --gris-claro:#9B93A5;
    --verde:#3E9A78; --alerta:#C4526F;
    --medida:1120px; --curva:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',system-ui,sans-serif;font-weight:300;background:var(--papel);color:var(--tinta);
       min-height:100vh;display:flex;flex-direction:column;line-height:1.55}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  .marco{width:100%;max-width:var(--medida);margin:0 auto;padding:0 28px;flex:1;display:flex;flex-direction:column}

  header{padding:34px 0 0;display:flex;align-items:center;gap:14px}
  .isotipo{width:34px;height:34px;flex:none}
  .marca{font-family:'Cormorant Garamond',serif;font-size:21px;letter-spacing:.12em;color:var(--morado-hondo)}
  .sello{font-size:12px;color:var(--gris-claro);letter-spacing:.1em;margin-left:auto}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:52px 0}
  main.arriba{justify-content:flex-start}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5.5vw,54px);font-weight:400;line-height:1.08}
  .bajada{margin-top:12px;max-width:46ch;color:var(--gris);font-size:16px}

  /* acceso */
  .acceso{max-width:400px;width:100%;margin:0 auto}
  .campo{margin-top:20px}
  label{display:block;font-size:13px;color:var(--gris);margin-bottom:7px}
  input,select{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--tinta);
    border:1px solid var(--linea);border-radius:12px;background:#fff;transition:border-color .25s,box-shadow .25s}
  input:focus,select:focus{outline:none;border-color:var(--lila);box-shadow:0 0 0 3px var(--lila-velo)}
  .primario{margin-top:28px;width:100%;padding:14px;border-radius:999px;color:#fff;font-size:14px;letter-spacing:.1em;
    background:linear-gradient(100deg,var(--morado-hondo),var(--magenta));transition:filter .25s,transform .2s}
  .primario:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .primario:disabled{opacity:.5;transform:none;cursor:default}
  .aviso{margin-top:16px;font-size:14px;color:var(--alerta);min-height:20px}

  /* divisiones */
  .divisiones{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .division{border:1px solid var(--linea);border-radius:var(--curva);background:#fff;padding:36px 30px 30px;
    display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;min-height:330px;
    position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
  .division::before{content:"";position:absolute;inset:0 0 auto;height:3px;
    background:linear-gradient(90deg,var(--morado-hondo),var(--magenta),var(--lila));opacity:0;transition:opacity .3s}
  .division.agua::before{background:linear-gradient(90deg,var(--magenta),var(--lila),var(--agua))}
  .division:hover,.division:focus-visible{transform:translateY(-4px);border-color:transparent;outline:none;
    box-shadow:0 14px 34px -18px rgba(110,32,92,.45),0 0 0 1px var(--lila)}
  .division:hover::before,.division:focus-visible::before{opacity:1}
  .emblema{width:132px;height:132px;display:grid;place-items:center}
  .emblema svg{width:100%;height:100%}
  .division h2{font-family:'Cormorant Garamond',serif;font-size:29px;font-weight:500;color:var(--morado-hondo)}
  .division .lema{font-size:12.5px;letter-spacing:.16em;color:var(--agua);margin-top:4px}
  .division p{font-size:14.5px;color:var(--gris);margin-top:10px;max-width:30ch}
  .entrar{margin-top:auto;font-size:13px;letter-spacing:.14em;color:#fff;background:var(--morado);
    border-radius:999px;padding:9px 26px;transition:background .3s}
  .division:hover .entrar{background:var(--morado-hondo)}
  .division.agua .entrar{background:var(--magenta)}

  /* barra de navegación interna */
  .atras{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--gris);
    border:1px solid var(--linea);border-radius:999px;padding:7px 18px 7px 14px;margin-bottom:22px;
    transition:border-color .25s,color .25s,background .25s}
  .atras:hover{color:var(--morado-hondo);border-color:var(--lila);background:var(--lila-velo)}
  .atras svg{width:16px;height:16px}
  .quien{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--gris);margin-top:12px;flex-wrap:wrap}
  .insignia{background:var(--lila-velo);color:var(--morado-hondo);border-radius:999px;padding:4px 14px;font-size:12.5px;letter-spacing:.06em}
  .salir{font-size:13px;color:var(--gris-claro)}
  .salir:hover{color:var(--morado)}

  /* módulos */
  .modulos{margin-top:36px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
  .modulo{border:1px solid var(--linea);border-radius:var(--curva);background:#fff;padding:32px 22px 26px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;min-height:210px;
    transition:transform .3s,box-shadow .3s,border-color .3s;cursor:pointer}
  .modulo:hover,.modulo:focus-visible{transform:translateY(-4px);border-color:transparent;outline:none;
    box-shadow:0 14px 30px -18px rgba(110,32,92,.4),0 0 0 1px var(--lila)}
  .icono{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
    background:var(--lila-velo);color:var(--morado);transition:background .3s,color .3s}
  .modulo:hover .icono{background:var(--agua-velo);color:var(--agua)}
  .icono svg{width:28px;height:28px}
  .modulo h3{font-size:18.5px;font-weight:400;color:var(--morado-hondo)}
  .modulo p{font-size:13.5px;color:var(--gris);max-width:26ch}
  .pronto{margin-top:auto;font-size:11.5px;color:var(--gris-claro);letter-spacing:.1em}

  /* módulo egresos */
  .filtro{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:24px}
  .filtro .campo{margin:0;min-width:190px}
  .cifras{margin-top:26px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .cifra{border:1px solid var(--linea);border-radius:var(--curva);background:#fff;padding:22px}
  .cifra span{font-size:12.5px;color:var(--gris-claro);letter-spacing:.08em;display:block}
  .cifra strong{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:500;color:var(--morado-hondo);display:block;margin-top:6px}
  .cifra.util strong{color:var(--verde)}
  .cifra.egre strong{color:var(--alerta)}
  .alerta{margin-top:22px;border:1px solid #F0D8DF;background:#FDF4F7;border-radius:var(--curva);padding:16px 20px;
    font-size:14px;color:#8A3550;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .alerta button{color:var(--morado-hondo);border-bottom:1px solid currentColor;font-size:13.5px}

  .pestanas{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
  .pestana{border:1px solid var(--linea);border-radius:999px;padding:8px 22px;font-size:14px;color:var(--gris);transition:.25s}
  .pestana:hover{border-color:var(--lila);color:var(--morado-hondo)}
  .pestana.viva{background:var(--morado-hondo);border-color:var(--morado-hondo);color:#fff}

  .tarjeta{margin-top:20px;border:1px solid var(--linea);border-radius:var(--curva);background:#fff;padding:24px;overflow:hidden}
  .tarjeta h4{font-size:16px;font-weight:400;color:var(--morado-hondo);margin-bottom:14px}
  .rejilla{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
  .rejilla .primario{margin-top:0;padding:12px 20px;width:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th{text-align:left;font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--gris-claro);padding:10px 12px;border-bottom:1px solid var(--linea)}
  td{padding:11px 12px;border-bottom:1px solid #F2EDF4;color:var(--tinta);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .vacio{padding:26px 12px;color:var(--gris-claro);font-size:14px;text-align:center}
  .tabla-scroll{overflow-x:auto;margin:0 -24px;padding:0 24px}
  .etiqueta{background:var(--lila-velo);color:var(--morado-hondo);border-radius:999px;padding:3px 11px;font-size:12px}
  .borrar{color:var(--gris-claro);font-size:13px}
  .borrar:hover{color:var(--alerta)}


  /* menú hamburguesa */
  .hamburguesa{display:none;width:40px;height:40px;border:1px solid var(--linea);border-radius:12px;
    align-items:center;justify-content:center;color:var(--morado-hondo);margin-left:auto}
  .hamburguesa svg{width:20px;height:20px}
  .menu{position:fixed;inset:0;background:rgba(43,36,48,.35);z-index:40;display:none}
  .menu.abierto{display:block}
  .menu-caja{position:absolute;top:0;right:0;width:min(300px,84vw);height:100%;background:#fff;
    padding:26px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:-12px 0 40px -20px rgba(43,36,48,.5)}
  .menu-caja h5{font-size:12px;letter-spacing:.12em;color:var(--gris-claro);margin:16px 0 6px;font-weight:400}
  .menu-caja button{text-align:left;padding:11px 12px;border-radius:12px;font-size:15px;color:var(--tinta)}
  .menu-caja button:hover{background:var(--lila-velo);color:var(--morado-hondo)}
  .cerrar-menu{align-self:flex-end;color:var(--gris-claro);font-size:22px;line-height:1;padding:4px 8px!important}

  /* botón de administración */
  .fila-admin{margin-top:26px;display:flex;justify-content:center}
  .btn-admin{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--linea);border-radius:999px;
    padding:11px 24px;font-size:14px;color:var(--gris);transition:.25s}
  .btn-admin:hover{border-color:var(--lila);color:var(--morado-hondo);background:var(--lila-velo)}
  .btn-admin svg{width:19px;height:19px}
  .btn-admin:hover svg{transform:rotate(45deg);transition:transform .4s}

  /* panel de administración */
  .admin{display:grid;grid-template-columns:230px 1fr;gap:28px;margin-top:30px;align-items:start}
  .lateral{border:1px solid var(--linea);border-radius:var(--curva);background:#fff;padding:14px;
    display:flex;flex-direction:column;gap:6px;position:sticky;top:20px}
  .subtab{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px;
    color:var(--gris);text-align:left;transition:.25s}
  .subtab svg{width:19px;height:19px;flex:none}
  .subtab:hover{background:var(--lila-velo);color:var(--morado-hondo)}
  .subtab.viva{background:var(--morado-hondo);color:#fff}
  .lateral-movil{display:none}
  @media (max-width:820px){
    .admin{grid-template-columns:1fr}
    .lateral{position:static;flex-direction:row;overflow-x:auto}
    .subtab{white-space:nowrap}
  }
  @media (max-width:640px){
    .hamburguesa{display:flex}
    .sello{display:none}
  }

  /* botón flotante */
  .flotante{position:fixed;right:26px;bottom:26px;width:58px;height:58px;border-radius:50%;z-index:30;
    background:linear-gradient(120deg,var(--morado-hondo),var(--magenta));color:#fff;display:grid;place-items:center;
    box-shadow:0 12px 28px -12px rgba(110,32,92,.7);transition:transform .25s}
  .flotante:hover{transform:scale(1.07)}
  .flotante svg{width:24px;height:24px}

  /* ventana de formulario */
  .velo{position:fixed;inset:0;background:rgba(43,36,48,.4);z-index:50;display:none;overflow-y:auto;padding:26px 16px}
  .velo.abierto{display:block}
  .ficha{background:#fff;border-radius:var(--curva);max-width:760px;margin:0 auto;padding:28px}
  .ficha h3{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--morado-hondo);margin-bottom:16px}
  .ficha .rejilla{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .ficha textarea{width:100%;padding:12px 14px;font:inherit;font-size:15px;border:1px solid var(--linea);
    border-radius:12px;min-height:70px;resize:vertical;color:var(--tinta)}
  .ficha .acciones{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .ficha .primario{margin:0;width:auto;padding:12px 28px}

  /* acciones al pasar el mouse por la fila */
  .acc{display:inline-flex;gap:8px;opacity:0;transition:opacity .2s}
  tr:hover .acc, tr:focus-within .acc{opacity:1}
  .acc button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--gris-claro)}
  .acc button:hover{background:var(--lila-velo);color:var(--morado-hondo)}
  .acc button.peligro:hover{background:#FCEEF2;color:var(--alerta)}
  .acc svg{width:15px;height:15px}
  @media (hover:none){.acc{opacity:1}}

  /* tabla de pagos */
  .th-plegable{cursor:pointer;user-select:none;white-space:nowrap}
  .th-plegable:hover{color:var(--morado-hondo)}
  .plegada{max-width:46px;width:46px;overflow:hidden;text-overflow:clip;color:var(--gris-claro)}
  .celda-pago{min-width:150px;position:relative}
  .celda-pago .texto{display:block;line-height:1.4;text-align:center}
  .celda-pago .venc{color:var(--gris-claro);font-size:12.5px;text-align:center}
  .celda-pago .lapiz{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .2s;
    width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--gris-claro)}
  .celda-pago:hover .lapiz{opacity:1}
  .celda-pago .lapiz:hover{background:var(--lila-velo);color:var(--morado-hondo)}
  .celda-pago .lapiz svg{width:14px;height:14px}
  .mas{width:100%;border:1px dashed var(--linea);border-radius:10px;padding:8px;color:var(--gris-claro);font-size:13px}
  .mas:hover{border-color:var(--lila);color:var(--morado-hondo);background:var(--lila-velo)}
  .grupo td{background:var(--lila-velo);color:var(--morado-hondo);font-size:13px;letter-spacing:.08em}

  @media (max-width:720px){
    .tabla-tarjetas thead{display:none}
    .tabla-tarjetas tr{display:block;border:1px solid var(--linea);border-radius:16px;margin-bottom:14px;padding:6px 4px}
    .tabla-tarjetas td{display:flex;justify-content:space-between;gap:14px;border:none;padding:8px 12px;text-align:right}
    .tabla-tarjetas td::before{content:attr(data-col);color:var(--gris-claro);font-size:12px;text-align:left;flex:none}
    .tabla-tarjetas tr.grupo{background:var(--lila-velo);padding:10px 12px}
    .tabla-tarjetas tr.grupo td{justify-content:flex-start}
    .celda-pago .lapiz{opacity:1;position:static;margin-left:auto}
  }
  /* marca de auditoría */
  td.audit{cursor:pointer;transition:background .2s;border-radius:8px}
  td.audit:hover{background:#FBF0F5}
  td.audit.marcado{background:#F7D3E0;color:#7A2544}
  td.audit.marcado::after{content:" ✓";color:#B4479B}
  td.audit.pagado{background:#D8F0E4;color:#1F6B4E}
  td.audit.pagado::after{content:" ✓";color:#2E8B62;font-weight:500}
  td.audit.deuda{background:#F7D3E0;color:#7A2544}
  td.audit.deuda::after{content:" deuda";color:#B4479B;font-size:11px}
  td.audit:hover{outline:2px solid var(--lila);outline-offset:-2px}
  th.plegable-socios{cursor:pointer;user-select:none}
  th.plegable-socios:hover{color:var(--morado-hondo)}

  /* fondo del módulo de alquileres */
  #pantalla-modulo.lila{position:relative}
  #pantalla-modulo.lila::before{
    content:"";position:fixed;right:0;bottom:0;width:min(900px,95vw);height:min(760px,85vh);
    background:radial-gradient(120% 110% at 100% 100%,
      rgba(180,71,155,.20) 0%, rgba(192,139,208,.14) 38%, rgba(253,252,253,0) 72%);
    pointer-events:none;z-index:-1}

  /* pie de tarjeta con acción secundaria */
  .pie-tarjeta{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .secundario{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--linea);border-radius:999px;
    padding:9px 20px;font-size:13.5px;color:var(--gris);transition:.25s}
  .secundario:hover{border-color:var(--lila);color:var(--morado-hondo);background:var(--lila-velo)}
  .secundario svg{width:16px;height:16px}
  .mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--linea);display:grid;place-items:center;
    color:var(--gris);transition:.25s}
  .mini:hover{border-color:var(--lila);color:var(--morado-hondo);background:var(--lila-velo)}
  .mini svg{width:16px;height:16px}
  .cabecera-tarjeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .cabecera-tarjeta h4{margin:0}

  /* enlace discreto de administración */
  .rincon{display:flex;justify-content:flex-end;margin-top:26px}
  .rincon .secundario{font-size:12.5px;padding:7px 16px;color:var(--gris-claro)}
  .rincon .secundario svg{width:14px;height:14px}

  /* calendario de avisos */
  .calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:8px}
  .dia-cab{font-size:11.5px;letter-spacing:.08em;color:var(--gris-claro);text-align:center;padding:4px 0}
  .dia{border:1px solid var(--linea);border-radius:12px;min-height:74px;padding:7px 8px;font-size:12px;
    display:flex;flex-direction:column;gap:3px;background:#fff}
  .dia.fuera{background:transparent;border-color:transparent}
  .dia .n{color:var(--gris-claro);font-size:12px}
  .dia.hoy{border-color:var(--lila);box-shadow:0 0 0 2px var(--lila-velo)}
  .dia.con-aviso{background:var(--lila-velo);border-color:var(--lila)}
  .punto{background:var(--morado-hondo);color:#fff;border-radius:7px;padding:2px 6px;font-size:10.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:640px){
    .calendario{gap:4px}
    .dia{min-height:58px;padding:5px;font-size:11px}
    .punto{font-size:9.5px;padding:1px 4px}
  }

  footer{padding:24px 0 30px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--gris-claro);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .oculto{display:none}
  @media (max-width:640px){.marco{padding:0 18px}main{padding:34px 0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="deg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C08BD0"/><stop offset="55%" stop-color="#B4479B"/><stop offset="100%" stop-color="#6A1F5C"/>
    </linearGradient>
    <symbol id="casa" viewBox="0 0 200 150">
      <path d="M96 10 8 132h24L96 40z" fill="url(#deg)" opacity=".35"/>
      <path d="M118 10 30 132h24l64-92z" fill="url(#deg)" opacity=".6"/>
      <path d="M140 10 52 132h132V10z" fill="url(#deg)"/>
      <path d="M150 62h18v70h-18z" fill="#6A1F5C"/>
      <rect x="96" y="60" width="34" height="34" rx="3" fill="#4FBBD4"/>
      <path d="M113 60v34M96 77h34" stroke="#FDFCFD" stroke-width="3"/>
    </symbol>
  </defs>
</svg>

<div class="marco">
  <header>
    <svg class="isotipo" viewBox="0 0 200 150"><use href="#casa"/></svg>
    <div class="marca">CREANDO TENDENCIAS</div>
    <div class="sello">Sistema interno</div>
    <button class="hamburguesa" id="btn-menu" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div class="menu" id="menu">
    <div class="menu-caja">

};

let division = null, perfilActual = null, mesActual = new Date().toISOString().slice(0,7), pestanaActual = "ingresos";

const S = n => "S/ " + (Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = t => String(t ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const mostrar = id => {
  ["pantalla-acceso","pantalla-divisiones","pantalla-panel","pantalla-modulo","pantalla-admin"]

// ---------- acceso ----------
$("btn-entrar").addEventListener("click", entrar);
$("clave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });

async function entrar(){
  const email = $("email").value.trim(), clave = $("clave").value;
  $("aviso").textContent = "";
  if (!email || !clave) { $("aviso").textContent = "Falta el correo o la contraseña."; return; }

  if (!conectado) { abrirDivisiones({nombre:email.split("@")[0], rol:"super_admin"}); return; }

  $("btn-entrar").disabled = true;
  const {data, error} = await sb.auth.signInWithPassword({email, password: clave});
  $("btn-entrar").disabled = false;
  if (error) {
    console.error("Supabase auth:", error);
    $("aviso").textContent = error.message === "Invalid login credentials"
      ? "Correo o contraseña incorrectos."
      : "No se pudo entrar: " + error.message;
    return;
  }

  const {data: perfil, error: errPerfil} =
    await sb.from("perfiles").select("nombre, rol, activo").eq("id", data.user.id).maybeSingle();
  if (errPerfil) {
    console.error("Supabase perfiles:", errPerfil);
    $("aviso").textContent = "Entraste, pero no se pudo leer tu perfil: " + errPerfil.message;
    return;
  }
  if (!perfil) {
    $("aviso").textContent = "Tu usuario existe en Supabase pero no tiene perfil. Falta correr el schema.";
    return;
  }
  if (!perfil.activo) {
    $("aviso").textContent = "Esta cuenta está desactivada. Habla con una super administradora.";
    await sb.auth.signOut(); return;
  }
  abrirDivisiones(perfil);
}

  perfilActual = perfil;
  $("quien-nombre").textContent = perfil.nombre || "";
  $("quien-rol").textContent = ROLES[perfil.rol] || perfil.rol;
  $("fila-admin").classList.toggle("oculto", perfil.rol !== "super_admin");
  mostrar("pantalla-divisiones");
}

$("btn-salir").addEventListener("click", async () => {
  if (conectado) await sb.auth.signOut();
  $("email").value = ""; $("clave").value = ""; perfilActual = null;
  mostrar("pantalla-acceso");
});

// ---------- navegación ----------
document.querySelectorAll(".division").forEach(b => b.addEventListener("click", () => {
  division = b.dataset.division;
  $("titulo-panel").textContent = DIVISIONES[division].nombre;

    </div>`).join("");
  document.querySelectorAll("[data-modulo]").forEach(m => {

  });
  $("rincon-usuarios").classList.toggle("oculto", perfilActual?.rol !== "super_admin");
  mostrar("pantalla-panel");
}));

window.irAUsuarios = () => { subActual = "usuarios"; abrirAdmin(); };

document.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", () => mostrar(b.dataset.ir)));
$("volver-panel").addEventListener("click", () => mostrar("pantalla-panel"));

function abrirModulo(id){
  $("titulo-modulo").textContent = MODULOS[id].nombre;

// ===============================================================
// MÓDULO: EGRESOS Y GASTOS
// ===============================================================
function modEgresos(){
  $("cuerpo-modulo").innerHTML = `
    <div class="filtro">
      <div class="campo">
        <label for="mes">Mes</label>
        <input id="mes" type="month" value="${mesActual}">
      </div>
    </div>
    <div class="cifras" id="cifras"></div>
    <div id="alertas"></div>
    <div class="pestanas">
      <button class="pestana" data-p="ingresos">Ingresos</button>
      <button class="pestana" data-p="egresos">Egresos</button>
      <button class="pestana" data-p="deudas">Deudas</button>
      <button class="pestana" data-p="resumen">Resumen</button>
    </div>
    <div id="contenido"></div>`;

  $("mes").addEventListener("change", e => { mesActual = e.target.value; refrescar(); });
  document.querySelectorAll(".pestana").forEach(p =>
    p.addEventListener("click", () => { pestanaActual = p.dataset.p; refrescar(); }));
  refrescar();
}

const rango = () => {
  const desde = mesActual + "-01";
  const [a,m] = mesActual.split("-").map(Number);
  const hasta = new Date(a, m, 0).toISOString().slice(0,10);
  return {desde, hasta};
};

async function cargarMaestros(){
  const [i, m, c, p] = await Promise.all([
    sb.from("inquilinos").select("id, nombre, propiedad, habitacion, metodo_pago").eq("activo", true).order("nombre"),
    sb.from("metodos_pago").select("*").eq("activo", true).order("nombre_interno"),
    sb.from("conceptos").select("*").eq("activo", true).order("nombre"),
    sb.from("pagadores").select("*").eq("activo", true).order("orden")
  ]);
  maestros = {inq:i.data||[], metodos:m.data||[], conceptos:c.data||[], pagadores:p.data||[]};
}

async function refrescar(){
  document.querySelectorAll(".pestana").forEach(p => p.classList.toggle("viva", p.dataset.p === pestanaActual));
  if (!conectado) {
    $("cifras").innerHTML = "";
    $("contenido").innerHTML = `<div class="tarjeta"><p class="vacio">Pega la anon key de Supabase para que este módulo cargue datos reales.</p></div>`;
    return;
  }
  await cargarMaestros();
  await pintarCifras();
  if (pestanaActual === "ingresos") pintarIngresos();
  else if (pestanaActual === "egresos") pintarEgresos();
  else if (pestanaActual === "deudas") pintarDeudas();
  else pintarResumen();
}

async function pintarCifras(){
  const {desde} = rango();
  const {data} = await sb.from("v_resumen_mensual").select("*").eq("mes", desde).maybeSingle();
  const r = data || {ingresos:0, varios:0, egresos:0, comision:0, utilidad:0};
  $("cifras").innerHTML = `
    <div class="cifra"><span>INGRESOS</span><strong>${S(r.ingresos)}</strong></div>
    <div class="cifra egre"><span>EGRESOS</span><strong>${S(r.egresos)}</strong></div>
    <div class="cifra"><span>COMISIÓN 10%</span><strong>${S(r.comision)}</strong></div>
    <div class="cifra util"><span>UTILIDAD</span><strong>${S(r.utilidad)}</strong></div>`;

  const {data: pend} = await sb.from("v_renta_pendiente").select("*");
  $("alertas").innerHTML = (pend && pend.length)
    ? `<div class="alerta">Falta pagar la renta al propietario de ${pend.map(p => esc(p.propiedad)).join(", ")}.
       ${pend.map(p => `<button onclick="pagarRenta('${esc(p.propiedad)}')">Registrar ${esc(p.propiedad)} · ${S(p.renta_propietario)}</button>`).join(" ")}</div>`
    : "";
}

window.pagarRenta = async (propiedad) => {
  const {error} = await sb.rpc("registrar_renta_dueno", {p_propiedad: propiedad});
  if (error) alert("No se pudo registrar: " + error.message); else refrescar();
};

function opcionesConcepto(ambito, actual){
  return maestros.conceptos.filter(c => c.ambito === ambito)
    .map(c => `<option ${c.nombre===actual?"selected":""}>${esc(c.nombre)}</option>`).join("");
}
function opcionesMetodo(actual){
  return `<option value="">—</option>` + maestros.metodos
    .map(m => `<option ${m.nombre_interno===actual?"selected":""}>${esc(m.nombre_interno)}</option>`).join("");
}
window.nuevoConcepto = async (ambito, selectId) => {
  const nombre = prompt("Nombre del concepto nuevo:");
  if (!nombre) return;
  const {error} = await sb.from("conceptos").insert({nombre: nombre.trim().toLowerCase(), ambito});
  if (error) { alert(error.message); return; }
  await cargarMaestros();
  const sel = $(selectId);
  if (sel) { sel.innerHTML = opcionesConcepto(ambito, nombre.trim().toLowerCase()); }
};

// ---- filtro genérico por columna ----
function barraFiltros(columnas, datos){
  return `<div class="filtro">${columnas.map(c => {
    if (c.tipo === "texto") {
      const valores = [...new Set(datos.map(r => r[c.campo]).filter(Boolean))].sort();
      return `<div class="campo"><label>${c.titulo}</label>
        <select onchange="ponerFiltro('${c.campo}', this.value)">
          <option value="">Todos</option>
          ${valores.map(v => `<option ${filtros[c.campo]===v?"selected":""}>${esc(v)}</option>`).join("")}
        </select></div>`;
    }
    if (c.tipo === "fecha")
      return `<div class="campo"><label>${c.titulo} desde</label>
        <input type="date" value="${filtros[c.campo+"_desde"]||""}" onchange="ponerFiltro('${c.campo}_desde', this.value)"></div>
        <div class="campo"><label>hasta</label>
        <input type="date" value="${filtros[c.campo+"_hasta"]||""}" onchange="ponerFiltro('${c.campo}_hasta', this.value)"></div>`;
    return `<div class="campo"><label>${c.titulo} mínimo</label>
      <input type="number" step="0.01" value="${filtros[c.campo+"_min"]||""}" onchange="ponerFiltro('${c.campo}_min', this.value)"></div>
      <div class="campo"><label>máximo</label>
      <input type="number" step="0.01" value="${filtros[c.campo+"_max"]||""}" onchange="ponerFiltro('${c.campo}_max', this.value)"></div>`;
  }).join("")}
  <div class="campo" style="min-width:auto"><label>&nbsp;</label>
    <button class="secundario" onclick="filtros={}; refrescar()">Limpiar filtros</button></div></div>`;
}
window.ponerFiltro = (campo, valor) => { valor ? filtros[campo] = valor : delete filtros[campo]; refrescar(); };

function aplicarFiltros(filas, columnas){
  return filas.filter(r => columnas.every(c => {
    if (c.tipo === "texto") return !filtros[c.campo] || r[c.campo] === filtros[c.campo];
    if (c.tipo === "fecha") {
      if (filtros[c.campo+"_desde"] && r[c.campo] < filtros[c.campo+"_desde"]) return false;
      if (filtros[c.campo+"_hasta"] && r[c.campo] > filtros[c.campo+"_hasta"]) return false;

    }
    if (filtros[c.campo+"_min"] && Number(r[c.campo]) < Number(filtros[c.campo+"_min"])) return false;
    if (filtros[c.campo+"_max"] && Number(r[c.campo]) > Number(filtros[c.campo+"_max"])) return false;
    return true;
  }));
}

function tabla(cabeceras, filas, numericas = []){
  if (!filas.length) return `<p class="vacio">Todavía no hay registros aquí.</p>`;
  const th = cabeceras.map((c,i) => {
    const num = numericas.includes(i) ? "num" : "";
    if (c && typeof c === "object" && "html" in c)
      return `<th class="${num} ${c.clase||""}" ${c.datos||""} ${c.click ? `onclick="${c.click}"` : ""}>${c.html}</th>`;
    return `<th class="${num}">${c}</th>`;
  }).join("");
  const celda = (c, i) => {
    const num = numericas.includes(i) ? "num" : "";
    if (c && typeof c === "object" && "html" in c)
      return `<td class="${num} ${c.clase||""}" ${c.datos||""} ${c.click ? `onclick="${c.click}"` : ""}
        title="${c.titulo || "Clic para cambiar el estado"}">${c.html}</td>`;
    return `<td class="${num}">${c}</td>`;
  };
  const tr = filas.map(f => "<tr>" + f.map(celda).join("") + "</tr>").join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

function celdaEstado(id, campo, estado, monto){

    titulo: "Un clic: pagado · dos: deuda · tres: sin marcar"
  };
}

// Lee el mensaje real que devuelve una Edge Function cuando falla
async function llamarFuncion(nombre, cuerpo){
  const {data, error} = await sb.functions.invoke(nombre, {body: cuerpo});
  if (!error) return {data};
  let detalle = error.message;
  try { const j = await error.context.json(); if (j?.error) detalle = j.error; } catch {}
  return {error: detalle};
}

window.cambiarModo = () => {
  const crear = $("u-modo").value === "crear";
  $("u-caja-clave").style.display = crear ? "" : "none";
  $("u-caja-gen").style.display = crear ? "" : "none";
};
const claveAlAzar = () => {
  const abc = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint32Array(12)), n => abc[n % abc.length]).join("");
};
window.generarClave = () => { $("u-clave").value = claveAlAzar(); };

window.invitar = async () => {
  const email = $("u-email").value.trim(), nombre = $("u-nombre").value.trim(),
        rol = $("u-rol").value, modo = $("u-modo").value, clave = $("u-clave").value;
  if (!email.includes("@")) { $("u-aviso").textContent = "Escribe un correo válido."; return; }
  if (modo === "crear" && clave.length < 8) { $("u-aviso").textContent = "La contraseña necesita al menos 8 caracteres."; return; }
  $("u-aviso").textContent = "Procesando…";
  const {error} = await llamarFuncion("invitar-usuario", {email, nombre, rol, modo, clave});
  if (error) { $("u-aviso").textContent = "No se pudo: " + error; return; }
  $("u-aviso").textContent = modo === "crear"
    ? `Cuenta creada. Pásale estos datos: ${email} · ${clave} — es la única vez que verás la contraseña.`
    : "Invitación enviada a " + email;
  $("u-email").value = ""; $("u-nombre").value = "";
  pintarUsuarios();
};

async function refrescarAlq(){

  if (pestAlq === "inquilinos") pintarInquilinos();
  else if (pestAlq === "pagos") vistaPagos === "propiedad" ? pintarPagos() : pintarCumplimiento();

  else pintarRecordatorios();
}

// ---------- pestaña pagos ----------
const RANURAS = [1,2,3,4,5];
function celdaVacia(n, onclick){
  return `<td class="celda-pago ${plegadas.has('pago'+n)?'plegada':''}" data-col="Pago ${n}">
    <button class="mas" onclick="${onclick}">Añadir</button></td>`;
}
function celdaLlena(p, n, onclick){
  const vence = p.dia_mes ? "Hasta " + p.dia_mes
              : (p.vence ? "Hasta " + Number(p.vence.slice(8,10)) : "sin día");
  return `<td class="celda-pago ${plegadas.has('pago'+n)?'plegada':''}" data-col="Pago ${n}">
    <span class="texto"><small style="color:var(--gris-claro)">S/ </small>${Math.ceil(Number(p.monto))} · ${esc(p.concepto)}</span>
    <span class="texto venc">${vence}${p.pagado ? " · pagado" : ""}</span>
    <button class="lapiz" onclick="${onclick}" title="Editar pago">${IC.lapiz}</button></td>`;
}

function pintarPagos(){
  const conceptos = [...new Set([...datos.pagos, ...datos.pagosProp]
    .map(p => p.concepto).filter(Boolean))].sort();
  const plegada = c => plegadas.has(c) ? "plegada" : "";
  const titulo = (c, texto) => plegadas.has(c) ? texto.slice(0,3) : texto;
  const pasaFiltro = p => !filtroConcepto || (p && p.concepto === filtroConcepto);

  let cuerpo = "";
  datos.props.filter(pr => pr.activa).forEach(pr => {
    const suyos = datos.inq.filter(q => q.propiedad === pr.propiedad && q.activo);

    // fila propia de la casa: existe haya o no inquilinos
    const celdasCasa = RANURAS.map(n => {
      const p = datos.pagosProp.find(x => x.propiedad === pr.propiedad && x.ranura === n);
      if (!pasaFiltro(p)) return `<td class="celda-pago ${plegada('pago'+n)}" data-col="Pago ${n}"></td>`;
      const accion = `fichaPagoCasa('${esc(pr.propiedad)}',${n})`;
      return p ? celdaLlena(p, n, accion) : celdaVacia(n, accion);
    }).join("");
    cuerpo += `<tr><td data-col="Propiedad" class="${plegada('propiedad')}">${esc(pr.propiedad)}</td>
      <td data-col="Inquilino" class="${plegada('inquilino')}">pago de la casa</td>${celdasCasa}</tr>`;

  });

  $("cuerpo-alq").innerHTML = `
    <div class="filtro">
      <div class="campo"><label>Filtrar por concepto</label>
        <select onchange="filtroConcepto=this.value; pintarPagos()">
          <option value="">Todos</option>
          ${conceptos.map(c => `<option ${c===filtroConcepto?"selected":""}>${esc(c)}</option>`).join("")}
        </select></div>
    </div>
    <div class="tarjeta">
      <div class="cabecera-tarjeta">
        <h4>Pagos de la propiedad</h4>
        <button class="secundario" onclick="vistaPagos='inquilino'; pintarCumplimiento()">Pagos de inquilino</button>
      </div>
      <p class="vacio" style="text-align:left;padding:0 0 10px">Los pagos fijos de cada casa. Haz clic en el título de una columna para plegarla.</p>
      <div class="tabla-scroll">
        ${datos.props.filter(p=>p.activa).length ? `<table class="tabla-tarjetas"><thead><tr>
          <th class="th-plegable ${plegada('propiedad')}" onclick="plegar('propiedad')">${titulo('propiedad','Propiedad')}</th>
          <th class="th-plegable ${plegada('inquilino')}" onclick="plegar('inquilino')">${titulo('inquilino','Inquilino')}</th>
          ${RANURAS.map(n => `<th class="th-plegable ${plegada('pago'+n)}" onclick="plegar('pago${n}')">${titulo('pago'+n,'Pago '+n)}</th>`).join("")}
        </tr></thead><tbody>${cuerpo}</tbody></table>`
        : `<p class="vacio">Añade una propiedad en la pestaña Propiedades.</p>`}
      </div>
    </div>`;
}

async function pintarCumplimiento(){
  const {data, error} = await sb.rpc("cumplimiento_mes", {p_mes: mesCumplimiento + "-01"});
  if (error) { $("cuerpo-alq").innerHTML = `<div class="tarjeta"><p class="vacio">${esc(error.message)}</p></div>`; return; }

  const color = e => e === "a tiempo" ? "var(--verde)"
                   : e === "con atraso" ? "var(--alerta)"
                   : e === "vencido sin registrar" ? "var(--alerta)" : "var(--gris-claro)";

  const porPropiedad = {};
  (data||[]).forEach(r => (porPropiedad[r.propiedad] ||= []).push(r));

  let cuerpo = "";
  Object.entries(porPropiedad).forEach(([prop, filas]) => {
    cuerpo += `<tr class="grupo"><td colspan="8">${esc(prop)} · ${filas.length} inquilino(s)</td></tr>`;
    filas.forEach(r => {
      cuerpo += `<tr>
        <td data-col="Inquilino">${esc(r.inquilino)}</td>
        <td data-col="Hab.">${esc(r.habitacion||"—")}</td>
        <td data-col="Según contrato">día ${r.dia_pago||"—"} · ${r.fecha_esperada.slice(8,10)}/${r.fecha_esperada.slice(5,7)}</td>

        <td data-col="Atraso" class="num">${r.dias_atraso === null ? "—" : (r.dias_atraso === 0 ? "sin atraso" : r.dias_atraso + " día(s)")}</td>
        <td data-col="Esperado" class="num">${S(r.monto_esperado)}</td>
        <td data-col="Pagado" class="num">${S(r.monto_pagado)}</td>
        <td data-col="Estado"><span style="color:${color(r.estado)}">${esc(r.estado)}</span></td>
      </tr>`;
    });
  });

  const conAtraso = (data||[]).filter(r => r.dias_atraso > 0).length;
  const aTiempo = (data||[]).filter(r => r.estado === "a tiempo").length;
  const sinPagar = (data||[]).filter(r => !r.fecha_pago).length;

  $("cuerpo-alq").innerHTML = `
    <div class="filtro">

      <div class="cifra egre"><span>CON ATRASO</span><strong>${conAtraso}</strong></div>
      <div class="cifra"><span>SIN REGISTRAR</span><strong>${sinPagar}</strong></div>
    </div>
    <div class="tarjeta">
      <div class="cabecera-tarjeta">
        <h4>Pagos de inquilino</h4>
        <button class="secundario" onclick="vistaPagos='propiedad'; pintarPagos()">Pagos de la propiedad</button>
      </div>
      <p class="vacio" style="text-align:left;padding:0 0 10px">
        La fecha de la izquierda sale del contrato. La de la derecha, del día en que registraste el pago en Ingresos.</p>
      <div class="tabla-scroll">
        ${cuerpo ? `<table class="tabla-tarjetas"><thead><tr>
          <th>Inquilino</th><th>Hab.</th><th>Según contrato</th><th>Se registró</th>
          <th class="num">Atraso</th><th class="num">Esperado</th><th class="num">Pagado</th><th>Estado</th>
        </tr></thead><tbody>${cuerpo}</tbody></table>`

    </div>`;
}

// ---------- pestaña recordatorios ----------
function calendarioAvisos(){
  const hoy = new Date();
  const anio = hoy.getFullYear(), mes = hoy.getMonth();
  const primero = new Date(anio, mes, 1);
  const dias = new Date(anio, mes + 1, 0).getDate();
  const arranque = (primero.getDay() + 6) % 7;   // lunes primero
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","setiembre","octubre","noviembre","diciembre"];

  const porDia = {};
  datos.avisos.forEach(a => {
    const d = a.fecha_aviso;
    if (!d.startsWith(`${anio}-${String(mes+1).padStart(2,"0")}`)) return;
    (porDia[Number(d.slice(8,10))] ||= []).push(a);
  });

  let celdas = "";
  for (let i = 0; i < arranque; i++) celdas += `<div class="dia fuera"></div>`;
  for (let d = 1; d <= dias; d++) {
    const lista = porDia[d] || [];
    const esHoy = d === hoy.getDate();
    celdas += `<div class="dia ${lista.length ? "con-aviso" : ""} ${esHoy ? "hoy" : ""}">
      <span class="n">${d}</span>
      ${lista.slice(0,3).map(a =>
        `<span class="punto" title="${esc(a.inquilino)} · ${esc(a.concepto)} · vence ${a.vence}">
          ${esc(a.propiedad)} ${Math.ceil(Number(a.monto))}</span>`).join("")}
      ${lista.length > 3 ? `<span class="n">+${lista.length - 3} más</span>` : ""}
    </div>`;
  }

  return `<div class="tarjeta">
    <h4>Avisos de ${meses[mes]} ${anio}</h4>
    <p class="vacio" style="text-align:left;padding:0 0 10px">
      Se arman solos desde los días de pago que registraste. ${datos.avisos.length} aviso(s) programado(s) en total.</p>
    <div class="calendario">
      ${["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"].map(d => `<div class="dia-cab">${d}</div>`).join("")}
      ${celdas}
    </div>
  </div>`;
}

  const nombre = prompt("¿Cómo se llama el recordatorio nuevo?", "Aviso extra");
  if (!nombre) return;
  const {error} = await sb.from("recordatorios").insert({nombre});
  if (error) alert(error.message); else refrescarAlq();
};

window.guardarRecordatorio = async (id) => {
  const v = k => $(`w${id}-${k}`).value;
  const {error} = await sb.from("recordatorios").update({
    nombre: v("nombre"), dias_antes: +v("dias"), hora: +v("hora"), zona: "America/Lima",
    conexion_id: v("cx") ? +v("cx") : null, tagear_todos: v("tag")==="si",
    activo: v("activo")==="si", encabezado: v("enc"), cierre: v("cie")
  }).eq("id", id);
  alert(error ? "No se guardó: " + error.message : "Recordatorio guardado.");
  if (!error) refrescarAlq();
};

// ---------- ventana de formulario reutilizable ----------
function abrirFicha(titulo, campos, alGuardar, alBorrar){
  $("ficha").innerHTML = `
    <h3>${esc(titulo)}</h3>
    ${campos}
    <p class="aviso" id="ficha-aviso"></p>
    <div class="acciones">
      ${alBorrar ? `<button class="atras" style="margin:0" id="ficha-borrar">Eliminar</button>` : ""}
      <button class="atras" style="margin:0" id="ficha-cancelar">Cancelar</button>
      <button class="primario" id="ficha-guardar">Guardar</button>
    </div>`;
  $("velo").classList.add("abierto");
  $("ficha-cancelar").onclick = cerrarFicha;
  $("ficha-guardar").onclick = async () => {
    $("ficha-guardar").disabled = true;
    const err = await alGuardar();
    $("ficha-guardar").disabled = false;
    if (err) { $("ficha-aviso").textContent = err; return; }
    cerrarFicha(); (enAdmin() ? abrirAdmin : pestAlqVivo() ? refrescarAlq : refrescar)();
  };
  if (alBorrar) $("ficha-borrar").onclick = async () => {
    if (!confirm("¿Eliminar este registro?")) return;
    if (!confirm("Última vez: no se puede deshacer. ¿Eliminar?")) return;
    const err = await alBorrar();
    if (err) { $("ficha-aviso").textContent = err; return; }
    cerrarFicha(); (enAdmin() ? abrirAdmin : pestAlqVivo() ? refrescarAlq : refrescar)();
  };
}
const pestAlqVivo = () => !!document.querySelector("[data-pa]");
const enAdmin = () => !$("pantalla-admin").classList.contains("oculto");
const cerrarFicha = () => $("velo").classList.remove("abierto");
$("velo").addEventListener("click", e => { if (e.target.id === "velo") cerrarFicha(); });

// sesión abierta al recargar
(async () => {
  if (!conectado) return;
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return;
  const {data: perfil} = await sb.from("perfiles").select("nombre, rol, activo").eq("id", session.user.id).single();
  if (perfil?.activo) abrirDivisiones(perfil);
})();
</script>
